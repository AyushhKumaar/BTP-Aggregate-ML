[project]
name = "btp-aggregate-ml"
version = "0.1.0"
description = "Physics-Informed ML for Predicting Single-Particle Crushing Mechanics and Post-Breakage Fractal Gradation of Recycled Aggregates"
readme = "README.md"
authors = [
    { name = "AyushhKumaar", email = "ayushkumar2k05@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "catboost>=1.2.10",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "pymupdf>=2.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "shap>=0.51.0",
    "streamlit>=1.66.1",
    "xgboost>=3.2.0",
]

[project.scripts]
btp-aggregate-ml = "btp_aggregate_ml:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
